# Default for Qwen-4B on 1 x 8 A100-80GB: ZeRO-3 sharding WITHOUT CPU offload.
# Model states ~64GB / 8 GPUs ~= 8GB per GPU, so offload only adds PCIe traffic.
# Use 1_node_8_gpus_deepspeed_zero3.yaml (with CPU offload) only if you hit OOM
# (larger model, fewer/smaller GPUs, much longer sequences).
compute_environment: LOCAL_MACHINE
deepspeed_config:
  deepspeed_multinode_launcher: standard
  gradient_clipping: 1.0
  offload_optimizer_device: none
  offload_param_device: none
  zero3_init_flag: true
  zero3_save_16bit_model: true
  zero_stage: 3
  zero_optimization:
    overlap_comm: false
distributed_type: DEEPSPEED
downcast_bf16: 'no'
main_training_function: main
mixed_precision: bf16
num_machines: 1
num_processes: 8
rdzv_backend: static
same_network: true
tpu_env: []
tpu_use_cluster: false
tpu_use_sudo: false
use_cpu: false
